# Builds an installable arm64 APK for the fork without touching the upstream
# release pipeline. Debug-signed (no key.properties here), and its own
# applicationId, so it installs next to the upstream app.
#
# Version name is "<upstream>+<fork>", e.g. 1.0.13+0.2.0:
#   * upstream part tracks app/pubspec.yaml (upstream release version);
#   * fork part lives in tooling/fork_version.txt — minor bump for a feature,
#     patch bump for a fix, untouched when only upstream moved.
name: Fork APK

on:
  push:
    branches: [direct-host]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  TZ: Asia/Shanghai

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Versions
        run: flutter --version

      - name: Compose version name
        id: ver
        run: |
          upstream=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' app/pubspec.yaml)
          fork=$(tr -d '[:space:]' < tooling/fork_version.txt)
          test -n "$upstream" -a -n "$fork"
          echo "name=$upstream+$fork" >> "$GITHUB_OUTPUT"
          echo "building $upstream+$fork"

      - name: Maven Central mirror
        # Central redirects some jars to github.com/JetBrains releases, which
        # answers 504 from the runners often enough to break a build. Rewrite
        # Central's URL to a plain mirror instead of adding a repository, so
        # the list order (and the plugin repositories) stay exactly as they
        # are; only the host changes.
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/mirror.gradle <<'EOF'
          def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
          def rewrite = { repos ->
            try {
              repos.all { repo ->
                try {
                  def url = repo.hasProperty('url') ? repo.url.toString() : ''
                  if (url.contains('repo.maven.apache.org') || url.contains('repo1.maven.org')) {
                    repo.url = mirror
                  }
                } catch (ignored) {}
              }
            } catch (ignored) {}
          }
          gradle.settingsEvaluated { settings ->
            rewrite(settings.dependencyResolutionManagement.repositories)
            rewrite(settings.pluginManagement.repositories)
          }
          gradle.beforeProject { project ->
            rewrite(project.repositories)
            rewrite(project.buildscript.repositories)
          }
          EOF
          cat ~/.gradle/init.d/mirror.gradle

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: >-
          flutter build apk --release --flavor arm64 --target-platform android-arm64
          --build-name "${{ steps.ver.outputs.name }}"

      - name: Collect
        run: |
          mkdir -p out
          cp app/build/app/outputs/flutter-apk/*.apk out/ 2>/dev/null || true
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-direct-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 7
